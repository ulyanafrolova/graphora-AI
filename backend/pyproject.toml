[project]
name = "graphora"
version = "0.1.0"
description = "Static, commit-pinned dependency graph with provenance on every edge"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "dulwich==1.2.19",
]

[project.scripts]
graphora = "graphora.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]
